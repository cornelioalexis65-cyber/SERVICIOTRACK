<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer subtle ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Main Graphic Group with Filter -->
  <g filter="url(#glow)">
    <!-- Graduation Cap Top Diamond -->
    <path d="M 256 120 L 416 195 L 256 270 L 96 195 Z" fill="url(#capGrad)" />
    
    <!-- Cap Rim / Skull Base -->
    <path d="M 166 230 L 166 300 C 166 350 346 350 346 300 L 346 230 L 256 270 Z" fill="#1d4ed8" opacity="0.95" />

    <!-- Tassel String & Bob -->
    <path d="M 256 195 Q 390 230 400 300" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="400" cy="310" r="14" fill="url(#goldGrad)" />

    <!-- Progress Check Badge at bottom right -->
    <circle cx="370" cy="380" r="54" fill="#10b981" stroke="#0f172a" stroke-width="8" />
    <path d="M 348 380 L 364 396 L 394 366" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
